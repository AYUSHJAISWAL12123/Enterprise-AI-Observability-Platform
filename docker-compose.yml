services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Mount local gcloud config for Application Default Credentials (ADC)
      - C:/Users/ayush/AppData/Roaming/gcloud:/home/appuser/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/.config/gcloud/application_default_credentials.json

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    env_file: .env
    volumes:
      - C:/Users/ayush/AppData/Roaming/gcloud:/home/appuser/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/.config/gcloud/application_default_credentials.json
    depends_on:
      - gateway

  evaluator:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    env_file: .env
    volumes:
      - C:/Users/ayush/AppData/Roaming/gcloud:/home/appuser/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/.config/gcloud/application_default_credentials.json
    # In k8s this is a CronJob; here we override CMD to run in a loop for local dev
    command: ["sh", "-c", "while true; do python -m evaluator.main; sleep 60; done"]

  alerts:
    build:
      context: .
      dockerfile: services/alerts/Dockerfile
    env_file: .env
    volumes:
      - C:/Users/ayush/AppData/Roaming/gcloud:/home/appuser/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/.config/gcloud/application_default_credentials.json
    # Run in a loop for local dev
    command: ["sh", "-c", "while true; do python -m alerts.main; sleep 60; done"]

  dashboard-api:
    build:
      context: .
      dockerfile: services/dashboard_api/Dockerfile
    ports:
      - "8080:8000"
    env_file: .env
    volumes:
      - C:/Users/ayush/AppData/Roaming/gcloud:/home/appuser/.config/gcloud:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/.config/gcloud/application_default_credentials.json

  dashboard-ui:
    build:
      context: web/dashboard
      dockerfile: ../../services/gateway/Dockerfile # Placeholder: we'd run npm dev locally usually
    # For a real setup we would have a dedicated Dockerfile for the Vite UI, 
    # but for local dev it's easier to run `npm run dev` directly on the host.
    profiles: ["ui-disabled"]
