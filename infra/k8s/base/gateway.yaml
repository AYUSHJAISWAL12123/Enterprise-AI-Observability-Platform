apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-ksa
  annotations:
    iam.gke.io/gcp-service-account: obs-gateway-sa@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway-ksa
      containers:
        - name: gateway
          image: obs-gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: obs-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
