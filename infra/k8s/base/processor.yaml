apiVersion: v1
kind: ServiceAccount
metadata:
  name: processor-ksa
  annotations:
    iam.gke.io/gcp-service-account: obs-processor-sa@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      serviceAccountName: processor-ksa
      containers:
        - name: processor
          image: obs-processor:latest
          envFrom:
            - configMapRef:
                name: obs-config
          # Using resources to ensure steady streaming throughput
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
