apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluator-ksa
  annotations:
    iam.gke.io/gcp-service-account: obs-evaluator-sa@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: evaluator
spec:
  schedule: "*/5 * * * *" # Every 5 minutes
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: evaluator-ksa
          restartPolicy: Never
          containers:
            - name: evaluator
              image: obs-evaluator:latest
              envFrom:
                - configMapRef:
                    name: obs-config
              resources:
                requests:
                  cpu: 1000m
                  memory: 1024Mi
