name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "gateway", "processor", "evaluator", "alerts", "dashboard_api" ]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Lint (Ruff)
        run: uv run ruff check services/${{ matrix.service }}/src services/${{ matrix.service }}/tests
      - name: Type Check (Mypy)
        run: uv run mypy services/${{ matrix.service }}/src
      - name: Test (Pytest)
        run: uv run pytest services/${{ matrix.service }}/tests -v

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type Check & Build
        run: npm run build
