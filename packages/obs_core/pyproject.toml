[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-core"
version = "0.1.0"
description = "Shared schemas, config, logging, and interfaces for obs-platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obs_core"]
