[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-sdk"
version = "0.1.0"
description = "Client SDK for AI apps to emit GenAI telemetry to the obs-platform gateway"
requires-python = ">=3.12"
dependencies = [
    "obs-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.uv.sources]
obs-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/obs_sdk"]
