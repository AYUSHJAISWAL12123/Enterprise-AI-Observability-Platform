[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-evaluator"
version = "0.1.0"
description = "CronJob worker that evaluates AI events using Vertex AI and writes scores to BigQuery"
requires-python = ">=3.12"
dependencies = [
    "obs-core",
    "google-cloud-bigquery>=3.25",
    "google-genai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.uv.sources]
obs-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator"]
