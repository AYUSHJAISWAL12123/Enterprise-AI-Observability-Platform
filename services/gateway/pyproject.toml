[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-gateway"
version = "0.1.0"
description = "Ingestion gateway: validates GenAI events, redacts PII, publishes to Pub/Sub"
requires-python = ">=3.12"
dependencies = [
    "obs-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "google-cloud-pubsub>=2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.uv.sources]
obs-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
