[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-alerts"
version = "0.1.0"
description = "Alerting engine for AI observability metrics"
requires-python = ">=3.12"
dependencies = [
    "obs-core",
    "google-cloud-bigquery>=3.25",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.uv.sources]
obs-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/alerts"]
